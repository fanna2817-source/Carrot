<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7fbf6a">
<title>Carrot KG & Amount Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7f3;
  color: #222;
}

.app {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

h1 {
  text-align: center;
  color: #5b9d4c;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 15px;
}

.sheet-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px;
  cursor: pointer;
}

.add-sheet {
  background: #6faa5c;
  color: white;
}

.remove-sheet {
  background: #ddd;
}

.sheet-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 12px;
}

.sheet-tab {
  background: white;
  border: 1px solid #ccc;
}

.sheet-tab.active {
  background: #9acb83;
  font-weight: bold;
}

.table-wrap {
  overflow-x: auto;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

table {
  border-collapse: collapse;
  min-width: 760px;
  width: 100%;
}

th,
td {
  border: 1px solid #ccc;
  padding: 7px;
  text-align: center;
}

th {
  background: #91c77b;
}

.row-number {
  width: 45px;
  background: #fafafa;
}

input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  text-align: center;
  font-size: 16px;
  padding: 7px;
}

input:focus {
  background: #eef8ea;
}

.summary {
  margin-top: 15px;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.summary-row {
  display: grid;
  grid-template-columns: 150px repeat(6, minmax(90px, 1fr));
  min-width: 700px;
}

.summary-container {
  overflow-x: auto;
}

.summary-row > div {
  border: 1px solid #ccc;
  padding: 9px;
  text-align: center;
}

.summary-label {
  font-weight: bold;
  background: #f5f5f5;
}

.total-row > div {
  background: #a8d394;
  font-weight: bold;
}

.price-row input {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 5px;
}

.bottom-total {
  margin-top: 15px;
  background: #79b766;
  color: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

@media (max-width: 600px) {
  .app {
    padding: 8px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>🥕 Carrot Calculator</h1>
<div class="subtitle">KG & Amount Calculator</div>

<div class="sheet-controls">
  <button class="add-sheet" onclick="addSheet()">＋ Add Sheet</button>
  <button class="remove-sheet" onclick="removeSheet()">− Remove Sheet</button>
</div>

<div class="sheet-tabs" id="sheetTabs"></div>

<div class="table-wrap">
<table id="buyerTable">
<thead>
<tr id="buyerHeaders">
<th class="row-number">#</th>
</tr>
</thead>

<tbody id="buyerRows"></tbody>
</table>
</div>

<div class="summary-container">
<div class="summary">

<div class="summary-row total-row" id="totalKiloRow">
<div class="summary-label">Total Kilo</div>
</div>

<div class="summary-row" id="lessRow">
<div class="summary-label">Less</div>
</div>

<div class="summary-row" id="remainingRow">
<div class="summary-label">Total Kilo</div>
</div>

<div class="summary-row price-row" id="priceRow">
<div class="summary-label">Price</div>
</div>

<div class="summary-row total-row" id="amountRow">
<div class="summary-label">Total</div>
</div>

</div>
</div>

<div class="bottom-total">
Σ of Total: <span id="grandTotal">0.00</span>
</div>

</div>

<script>

let sheets = [];
let currentSheet = 0;

const MAX_VISIBLE_BUYERS = 6;
const ROWS = 10;

function createSheet(name) {
  return {
    name: name,
    buyers: Array(MAX_VISIBLE_BUYERS).fill().map((_, i) => ({
      name: "Buyer " + (i + 1),
      kilos: Array(ROWS).fill("")
    })),
    less: Array(MAX_VISIBLE_BUYERS).fill(10),
    price: Array(MAX_VISIBLE_BUYERS).fill("")
  };
}

sheets.push(createSheet("Carrot 1"));

function addSheet() {
  sheets.push(createSheet("Carrot " + (sheets.length + 1)));
  currentSheet = sheets.length - 1;
  render();
}

function removeSheet() {
  if (sheets.length <= 1) {
    alert("You need at least one sheet.");
    return;
  }

  sheets.splice(currentSheet, 1);
  currentSheet = Math.max(0, currentSheet - 1);
  render();
}

function render() {
  renderTabs();
  renderTable();
  calculate();
}

function renderTabs() {
  const tabs = document.getElementById("sheetTabs");
  tabs.innerHTML = "";

  sheets.forEach((sheet, index) => {
    const button = document.createElement("button");

    button.className = "sheet-tab" +
      (index === currentSheet ? " active" : "");

    button.textContent = sheet.name;

    button.onclick = () => {
      currentSheet = index;
      render();
    };

    tabs.appendChild(button);
  });
}

function renderTable() {

  const header = document.getElementById("buyerHeaders");
  const rows = document.getElementById("buyerRows");

  header.innerHTML = '<th class="row-number">#</th>';
  rows.innerHTML = "";

  const sheet = sheets[currentSheet];

  sheet.buyers.forEach((buyer, buyerIndex) => {

    const th = document.createElement("th");

    const input = document.createElement("input");
    input.value = buyer.name;

    input.oninput = function() {
      sheet.buyers[buyerIndex].name = this.value;
    };

    th.appendChild(input);
    header.appendChild(th);
  });

  for (let row = 0; row < ROWS; row++) {

    const tr = document.createElement("tr");

    const number = document.createElement("td");
    number.className = "row-number";
    number.textContent = row + 1;

    tr.appendChild(number);

    sheet.buyers.forEach((buyer, buyerIndex) => {

      const td = document.createElement("td");

      const input = document.createElement("input");
      input.type = "number";
      input.inputMode = "decimal";
      input.placeholder = "KG";
      input.value = buyer.kilos[row];

      input.oninput = function() {
        sheet.buyers[buyerIndex].kilos[row] = this.value;
        calculate();
      };

      td.appendChild(input);
      tr.appendChild(td);
    });

    rows.appendChild(tr);
  }

  // Add the 6 buyer columns
  // More columns can be added by increasing MAX_VISIBLE_BUYERS.
  updateSummary();
}

function updateSummary() {

  const sheet = sheets[currentSheet];

  const totalRow = document.getElementById("totalKiloRow");
  const lessRow = document.getElementById("lessRow");
  const remainingRow = document.getElementById("remainingRow");
  const priceRow = document.getElementById("priceRow");
  const amountRow = document.getElementById("amountRow");

  totalRow.innerHTML = '<div class="summary-label">Total Kilo</div>';
  lessRow.innerHTML = '<div class="summary-label">Less</div>';
  remainingRow.innerHTML = '<div class="summary-label">Total Kilo</div>';
  priceRow.innerHTML = '<div class="summary-label">Price</div>';
  amountRow.innerHTML = '<div class="summary-label">Total</div>';

  sheet.buyers.forEach((buyer, index) => {

    const total = buyer.kilos.reduce((sum, value) => {
      return sum + (parseFloat(value) || 0);
    }, 0);

    const totalCell = document.createElement("div");
    totalCell.textContent = total.toFixed(2);
    totalRow.appendChild(totalCell);

    const lessCell = document.createElement("div");

    const lessInput = document.createElement("input");
    lessInput.type = "number";
    lessInput.value = sheet.less[index];

    lessInput.oninput = function() {
      sheet.less[index] = parseFloat(this.value) || 0;
      calculate();
    };

    lessCell.appendChild(lessInput);
    lessRow.appendChild(lessCell);

    const remaining = total - sheet.less[index];

    const remainingCell = document.createElement("div");
    remainingCell.textContent = remaining.toFixed(2);
    remainingRow.appendChild(remainingCell);

    const priceCell = document.createElement("div");

    const priceInput = document.createElement("input");
    priceInput.type = "number";
    priceInput.placeholder = "₱ Price";
    priceInput.value = sheet.price[index];

    priceInput.oninput = function() {
      sheet.price[index] = this.value;
      calculate();
    };

    priceCell.appendChild(priceInput);
    priceRow.appendChild(priceCell);

    const amountCell = document.createElement("div");
    const price = parseFloat(sheet.price[index]) || 0;

    amountCell.textContent =
      (remaining * price).toFixed(2);

    amountRow.appendChild(amountCell);
  });
}

function calculate() {

  updateSummary();

  const sheet = sheets[currentSheet];

  let grandTotal = 0;

  sheet.buyers.forEach((buyer, index) => {

    const total = buyer.kilos.reduce((sum, value) => {
      return sum + (parseFloat(value) || 0);
    }, 0);

    const remaining = total - sheet.less[index];
    const price = parseFloat(sheet.price[index]) || 0;

    grandTotal += remaining * price;
  });

  document.getElementById("grandTotal").textContent =
    grandTotal.toFixed(2);
}

render();

</script>

</body>
</html>
