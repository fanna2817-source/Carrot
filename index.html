<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#82c56d">
<title>Carrot Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f5f7f3;
  color: #222;
}

.container {
  max-width: 100%;
  margin: 0 auto;
  padding: 10px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.title {
  font-size: 27px;
  font-weight: 700;
  color: #559c4d;
}

.saved {
  color: #777;
  font-size: 14px;
}

.sheet-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.sheet-btn,
.new-sheet,
.remove-sheet {
  border: none;
  border-radius: 14px;
  padding: 12px 20px;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
}

.sheet-btn {
  background: #91c978;
  color: #222;
}

.new-sheet {
  background: #222;
  color: white;
}

.remove-sheet {
  margin-top: 8px;
  background: #eadede;
  color: #0785e9;
}

.controls {
  display: flex;
  gap: 8px;
  margin: 10px 0;
}

.add-btn,
.remove-btn {
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: 700;
}

.add-btn {
  background: #82c56d;
  color: white;
}

.remove-btn {
  background: #eadede;
  color: #0785e9;
}

/* Horizontal scrolling */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border-radius: 18px;
  background: white;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

/*
  1 number column + 6 buyer columns.
  Additional buyers automatically make the table wider
  and can be reached by horizontal scrolling.
*/
table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
}

th,
td {
  border-right: 2px solid #d9ddd8;
  border-bottom: 2px solid #d9ddd8;
  text-align: center;
  height: 68px;
  min-width: 155px;
  padding: 5px;
}

th:first-child,
td:first-child {
  min-width: 58px;
  width: 58px;
}

th {
  background: #91c978;
  color: #111;
  font-size: 18px;
  font-weight: 700;
}

.number-cell {
  font-weight: 700;
  font-size: 17px;
  background: #fafafa;
}

input {
  width: 100%;
  height: 52px;
  border: 1px solid #d7ddd5;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  background: white;
  outline: none;
}

input:focus {
  border: 2px solid #82c56d;
}

.kg-input::placeholder,
.less-input::placeholder,
.price-input::placeholder {
  color: #aaa;
}

/* Summary rows */
.summary-label {
  background: #dcefd6;
  font-weight: 700;
  font-size: 17px;
  text-align: left;
  padding-left: 12px;
}

.total-kilo-row td {
  background: #dcefd6;
  font-size: 18px;
  font-weight: 700;
}

.less-row td {
  background: #fff;
}

.remaining-row td {
  background: #f1f7ef;
  font-size: 18px;
  font-weight: 700;
}

.price-row td {
  background: white;
}

.total-row td {
  background: #91c978;
  font-size: 20px;
  font-weight: 800;
}

.grand-total {
  margin-top: 15px;
  background: #82c56d;
  color: white;
  padding: 18px 12px;
  border-radius: 16px;
  text-align: center;
  font-size: 21px;
  font-weight: 800;
}

.help {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="title">🥕 Carrot Calculator</div>
    <div class="saved" id="savedText">Saved</div>
  </div>

  <!-- CLIENT / SHEET BUTTONS -->
  <div class="sheet-bar" id="sheetBar"></div>

  <button class="remove-sheet" onclick="removeSheet()">
    − Remove Sheet
  </button>

  <!-- BUYER CONTROLS -->
  <div class="controls">
    <button class="add-btn" onclick="addBuyer()">
      + Add Buyer
    </button>

    <button class="remove-btn" onclick="removeBuyer()">
      − Remove Buyer
    </button>
  </div>

  <!-- CALCULATOR -->
  <div class="table-wrap">
    <table id="calculatorTable">
      <thead>
        <tr id="headerRow">
          <th>#</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

      <tfoot>

        <!-- TOTAL KILO -->
        <tr class="total-kilo-row">
          <td class="summary-label">Total Kilo</td>
        </tr>

        <!-- LESS -->
        <tr class="less-row">
          <td class="summary-label">Less</td>
        </tr>

        <!-- REMAINING -->
        <tr class="remaining-row">
          <td class="summary-label">Total Kilo</td>
        </tr>

        <!-- PRICE -->
        <tr class="price-row">
          <td class="summary-label">Price</td>
        </tr>

        <!-- TOTAL -->
        <tr class="total-row">
          <td class="summary-label">Total</td>
        </tr>

      </tfoot>
    </table>
  </div>

  <div class="grand-total" id="grandTotal">
    Σ of Total: ₱0.00
  </div>

  <div class="help">
    Enter KG and Price manually. Less can also be adjusted manually.
  </div>

</div>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const ROWS = 10;

/*
   Starts with 6 buyers.
   You can add more using + Add Buyer.
*/
const STARTING_BUYERS = 6;


/* =========================================================
   DATA
========================================================= */

let sheets = [];
let currentSheet = 0;


/* =========================================================
   CREATE NEW SHEET
========================================================= */

function createSheet(name) {

  const buyers = [];

  for (let i = 0; i < STARTING_BUYERS; i++) {

    buyers.push({
      name: "Buyer " + (i + 1),
      kg: Array(ROWS).fill(""),
      less: "10",
      price: ""
    });

  }

  return {
    name: name,
    buyers: buyers
  };
}


/* =========================================================
   LOAD DATA
========================================================= */

function loadData() {

  const saved = localStorage.getItem("carrotCalculatorData");

  if (saved) {

    try {

      const data = JSON.parse(saved);

      if (data && data.sheets && data.sheets.length) {

        sheets = data.sheets;
        currentSheet = data.currentSheet || 0;

        return;
      }

    } catch (error) {
      console.log("Saved data could not be loaded.");
    }
  }

  sheets = [
    createSheet("Client 1")
  ];

  currentSheet = 0;
}


/* =========================================================
   SAVE DATA
========================================================= */

function saveData() {

  localStorage.setItem(
    "carrotCalculatorData",
    JSON.stringify({
      sheets: sheets,
      currentSheet: currentSheet
    })
  );

  document.getElementById("savedText").textContent = "Saved";

  setTimeout(() => {
    document.getElementById("savedText").textContent = "Saved";
  }, 500);
}


/* =========================================================
   RENDER SHEET BUTTONS
========================================================= */

function renderSheets() {

  const bar = document.getElementById("sheetBar");

  bar.innerHTML = "";

  sheets.forEach((sheet, index) => {

    const button = document.createElement("button");

    button.className = "sheet-btn";

    button.textContent = sheet.name;

    button.onclick = function() {

      currentSheet = index;

      render();

    };

    bar.appendChild(button);

  });
}


/* =========================================================
   RENDER CALCULATOR
========================================================= */

function render() {

  renderSheets();

  const sheet = sheets[currentSheet];

  const headerRow = document.getElementById("headerRow");

  const tableBody = document.getElementById("tableBody");

  /*
    Rebuild header
  */

  headerRow.innerHTML = "<th>#</th>";

  sheet.buyers.forEach((buyer, buyerIndex) => {

    const th = document.createElement("th");

    const input = document.createElement("input");

    input.value = buyer.name;

    input.placeholder = "Buyer " + (buyerIndex + 1);

    input.style.fontWeight = "700";
    input.style.background = "transparent";
    input.style.border = "none";

    input.oninput = function() {

      buyer.name = input.value;

      saveData();

    };

    th.appendChild(input);

    headerRow.appendChild(th);

  });


  /*
    Build the 10 KG rows
  */

  tableBody.innerHTML = "";

  for (let row = 0; row < ROWS; row++) {

    const tr = document.createElement("tr");

    const number = document.createElement("td");

    number.className = "number-cell";

    number.textContent = row + 1;

    tr.appendChild(number);


    sheet.buyers.forEach((buyer) => {

      const td = document.createElement("td");

      const input = document.createElement("input");

      input.className = "kg-input";

      input.type = "number";

      input.inputMode = "decimal";

      input.min = "0";

      input.step = "0.01";

      input.placeholder = "KG";

      input.value = buyer.kg[row] || "";

      input.oninput = function() {

        buyer.kg[row] = input.value;

        calculate();

        saveData();

      };

      td.appendChild(input);

      tr.appendChild(td);

    });

    tableBody.appendChild(tr);

  }


  /*
    Build summary rows
  */

  buildSummaryRows();

  calculate();
}


/* =========================================================
   SUMMARY ROWS
========================================================= */

function buildSummaryRows() {

  const sheet = sheets[currentSheet];

  const totalKiloRow =
    document.querySelector(".total-kilo-row");

  const lessRow =
    document.querySelector(".less-row");

  const remainingRow =
    document.querySelector(".remaining-row");

  const priceRow =
    document.querySelector(".price-row");

  const totalRow =
    document.querySelector(".total-row");


  /*
    Keep first label cell
  */

  while (totalKiloRow.children.length > 1)
    totalKiloRow.removeChild(totalKiloRow.lastChild);

  while (lessRow.children.length > 1)
    lessRow.removeChild(lessRow.lastChild);

  while (remainingRow.children.length > 1)
    remainingRow.removeChild(remainingRow.lastChild);

  while (priceRow.children.length > 1)
    priceRow.removeChild(priceRow.lastChild);

  while (totalRow.children.length > 1)
    totalRow.removeChild(totalRow.lastChild);


  sheet.buyers.forEach((buyer, buyerIndex) => {

    /* TOTAL KILO */

    const totalCell = document.createElement("td");

    totalCell.id = "totalKilo-" + buyerIndex;

    totalCell.textContent = "0.00";

    totalKiloRow.appendChild(totalCell);


    /* LESS */

    const lessCell = document.createElement("td");

    const lessInput = document.createElement("input");

    lessInput.type = "number";

    lessInput.inputMode = "decimal";

    lessInput.step = "0.01";

    lessInput.className = "less-input";

    lessInput.value = buyer.less;

    lessInput.oninput = function() {

      buyer.less = lessInput.value;

      calculate();

      saveData();

    };

    lessCell.appendChild(lessInput);

    lessRow.appendChild(lessCell);


    /* REMAINING KILO */

    const remainingCell = document.createElement("td");

    remainingCell.id = "remaining-" + buyerIndex;

    remainingCell.textContent = "0.00";

    remainingRow.appendChild(remainingCell);


    /* PRICE */

    const priceCell = document.createElement("td");

    const priceInput = document.createElement("input");

    priceInput.type = "number";

    priceInput.inputMode = "decimal";

    priceInput.step = "0.01";

    priceInput.min = "0";

    priceInput.className = "price-input";

    priceInput.placeholder = "₱ Price";

    priceInput.value = buyer.price;

    priceInput.oninput = function() {

      buyer.price = priceInput.value;

      calculate();

      saveData();

    };

    priceCell.appendChild(priceInput);

    priceRow.appendChild(priceCell);


    /* TOTAL */

    const totalAmountCell = document.createElement("td");

    totalAmountCell.id = "totalAmount-" + buyerIndex;

    totalAmountCell.textContent = "0.00";

    totalRow.appendChild(totalAmountCell);

  });

}


/* =========================================================
   CALCULATION
========================================================= */

function calculate() {

  const sheet = sheets[currentSheet];

  let grandTotal = 0;


  sheet.buyers.forEach((buyer, buyerIndex) => {

    /*
      Add all KG entered for this buyer
    */

    let totalKilo = 0;

    buyer.kg.forEach(value => {

      const number = parseFloat(value);

      if (!isNaN(number)) {

        totalKilo += number;

      }

    });


    /*
      LESS

      This is manually adjustable.
      Example:

      Total KG = 25
      Less = 10
      Remaining = 15
    */

    let less = parseFloat(buyer.less);

    if (isNaN(less)) {
      less = 0;
    }


    /*
      Remaining KG cannot go below zero.
    */

    let remaining = totalKilo - less;

    if (remaining < 0) {
      remaining = 0;
    }


    /*
      PRICE
    */

    let price = parseFloat(buyer.price);

    if (isNaN(price)) {
      price = 0;
    }


    /*
      TOTAL AMOUNT

      Remaining KG × Price
    */

    const totalAmount = remaining * price;

    grandTotal += totalAmount;


    /*
      Display values
    */

    const totalKiloCell =
      document.getElementById("totalKilo-" + buyerIndex);

    const remainingCell =
      document.getElementById("remaining-" + buyerIndex);

    const totalAmountCell =
      document.getElementById("totalAmount-" + buyerIndex);


    if (totalKiloCell) {
      totalKiloCell.textContent =
        totalKilo.toFixed(2);
    }

    if (remainingCell) {
      remainingCell.textContent =
        remaining.toFixed(2);
    }

    if (totalAmountCell) {
      totalAmountCell.textContent =
        "₱" + totalAmount.toFixed(2);
    }

  });


  /*
    GRAND TOTAL
  */

  document.getElementById("grandTotal").textContent =
    "Σ of Total: ₱" + grandTotal.toFixed(2);

}


/* =========================================================
   ADD BUYER
========================================================= */

function addBuyer() {

  const sheet = sheets[currentSheet];

  const number = sheet.buyers.length + 1;

  sheet.buyers.push({

    name: "Buyer " + number,

    kg: Array(ROWS).fill(""),

    less: "10",

    price: ""

  });

  saveData();

  render();

}


/* =========================================================
   REMOVE BUYER
========================================================= */

function removeBuyer() {

  const sheet = sheets[currentSheet];

  /*
    Keep at least one buyer.
  */

  if (sheet.buyers.length <= 1) {

    alert("You need at least 1 buyer.");

    return;

  }

  sheet.buyers.pop();

  saveData();

  render();

}


/* =========================================================
   ADD NEW CLIENT SHEET
========================================================= */

function addSheet() {

  const number = sheets.length + 1;

  sheets.push(
    createSheet("Client " + number)
  );

  currentSheet = sheets.length - 1;

  saveData();

  render();

}


/* =========================================================
   REMOVE CLIENT SHEET
========================================================= */

function removeSheet() {

  if (sheets.length <= 1) {

    alert("You need at least 1 client sheet.");

    return;

  }


  const sheetName =
    sheets[currentSheet].name;

  const confirmDelete =
    confirm(
      "Remove " + sheetName + "?"
    );

  if (!confirmDelete) {
    return;
  }


  sheets.splice(currentSheet, 1);


  if (currentSheet >= sheets.length) {

    currentSheet =
      sheets.length - 1;

  }


  saveData();

  render();

}


/* =========================================================
   NEW SHEET BUTTON
========================================================= */

document
  .querySelector(".new-sheet");

</script>

<!--
  The New Sheet button is created here so it can call addSheet().
-->
<script>

(function() {

  const bar =
    document.getElementById("sheetBar");

  const newButton =
    document.createElement("button");

  newButton.className = "new-sheet";

  newButton.textContent = "+ New Sheet";

  newButton.onclick = function() {

    addSheet();

  };

  /*
    Put the New Sheet button after the client buttons.
  */

  bar.parentNode.insertBefore(
    newButton,
    bar.nextSibling
  );

})();


/* Start application */

loadData();

render();

</script>

</body>
</html>
