<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#7fbd68">

<title>Carrot KG & Amount Calculator</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7f3;
  color: #222;
}

.app {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px;
}

/* TITLE */

h1 {
  text-align: center;
  color: #5c9d4d;
  margin: 8px 0 3px;
  font-size: 26px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 14px;
}

/* SHEET CONTROLS */

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.add-sheet {
  background: #7fbd68;
  color: white;
}

.remove-sheet {
  background: #dddddd;
  color: #333;
}

/* SHEET TABS */

.sheet-tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 7px;
}

.sheet-tab {
  background: white;
  border: 1px solid #cccccc;
  white-space: nowrap;
}

.sheet-tab.active {
  background: #91c77b;
  color: #173b10;
}

/* BUYER CONTROLS */

.buyer-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.add-buyer {
  background: #5c9d4d;
  color: white;
}

.remove-buyer {
  background: #dddddd;
}

/* TABLE */

.table-container {
  width: 100%;
  overflow-x: auto;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);

  /* Allows smooth horizontal scrolling on iPhone */
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
  table-layout: auto;
}

th,
td {
  border: 1px solid #cccccc;
  padding: 0;
  text-align: center;
  white-space: nowrap;
}

/* NUMBER COLUMN */

.number-header,
.number-cell {
  width: 45px;
  min-width: 45px;
  max-width: 45px;
}

.number-header {
  background: #91c77b;
  font-size: 18px;
  padding: 9px 5px;
}

.number-cell {
  background: #fafafa;
  font-size: 17px;
  padding: 9px 5px;
}

/* BUYER COLUMNS */

.buyer-header {
  background: #91c77b;
  min-width: 110px;
  width: auto;
  padding: 0;
}

.buyer-name {
  display: block;
  width: 100%;
  min-width: 100px;
  border: none;
  outline: none;
  background: transparent;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  padding: 10px 7px;
}

/* AUTOMATIC WIDTH BASED ON CONTENT */

.buyer-name:focus {
  background: #eaf5e5;
}

/* KILO INPUT */

.kilo-input {
  width: 100%;
  min-width: 95px;
  border: none;
  outline: none;
  background: transparent;
  text-align: center;
  font-size: 17px;
  padding: 10px 6px;
}

.kilo-input:focus {
  background: #eef8ea;
}

/* SUMMARY */

.summary-container {
  width: 100%;
  overflow-x: auto;
  margin-top: 14px;
  -webkit-overflow-scrolling: touch;
}

.summary {
  width: max-content;
  min-width: 100%;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/*
Each summary row uses the same number of columns
as the buyer table.
*/

.summary-row {
  display: flex;
  min-width: max-content;
}

.summary-label {
  width: 150px;
  min-width: 150px;
  padding: 10px;
  border: 1px solid #cccccc;
  background: #f7f7f7;
  font-weight: bold;
  text-align: center;
}

.summary-cell {
  min-width: 110px;
  padding: 0;
  border: 1px solid #cccccc;
  text-align: center;
}

/* SUMMARY INPUTS */

.summary-input {
  width: 100%;
  min-width: 105px;
  padding: 9px 5px;
  border: none;
  outline: none;
  text-align: center;
  background: transparent;
  font-size: 16px;
}

.summary-input:focus {
  background: #eef8ea;
}

/* GREEN TOTAL ROWS */

.green-row .summary-label,
.green-row .summary-cell {
  background: #dcefd5;
}

.dark-green-row .summary-label,
.dark-green-row .summary-cell {
  background: #91c77b;
  font-weight: bold;
}

/* PRICE */

.price-input {
  border: 1px solid #dddddd;
  border-radius: 5px;
  margin: 4px;
  width: calc(100% - 8px);
}

/* GRAND TOTAL */

.grand-total {
  margin-top: 15px;
  background: #7fbd68;
  color: white;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  font-size: 21px;
  font-weight: bold;
}

/* MOBILE */

@media (max-width: 600px) {

  .app {
    padding: 7px;
  }

  h1 {
    font-size: 23px;
  }

  .buyer-name {
    font-size: 16px;
  }

  .kilo-input {
    font-size: 16px;
  }

  .summary-label {
    width: 130px;
    min-width: 130px;
  }
}

</style>
</head>

<body>

<div class="app">

  <h1>🥕 Carrot Calculator</h1>

  <div class="subtitle">
    KG & Amount Calculator
  </div>


  <!-- SHEETS -->

  <div class="controls">

    <button
      class="add-sheet"
      onclick="addSheet()">
      ＋ Add Sheet
    </button>

    <button
      class="remove-sheet"
      onclick="removeSheet()">
      − Remove Sheet
    </button>

  </div>


  <!-- SHEET TABS -->

  <div
    class="sheet-tabs"
    id="sheetTabs">
  </div>


  <!-- BUYER CONTROLS -->

  <div class="buyer-controls">

    <button
      class="add-buyer"
      onclick="addBuyer()">
      ＋ Add Buyer
    </button>

    <button
      class="remove-buyer"
      onclick="removeBuyer()">
      − Remove Buyer
    </button>

  </div>


  <!-- MAIN TABLE -->

  <div class="table-container">

    <table>

      <thead>

        <tr id="buyerHeaders">

          <th class="number-header">
            #
          </th>

        </tr>

      </thead>

      <tbody id="buyerRows">

      </tbody>

    </table>

  </div>


  <!-- SUMMARY -->

  <div class="summary-container">

    <div class="summary">


      <!-- TOTAL KILO -->

      <div
        class="summary-row green-row"
        id="totalKiloRow">

        <div class="summary-label">
          Total Kilo
        </div>

      </div>


      <!-- LESS -->

      <div
        class="summary-row"
        id="lessRow">

        <div class="summary-label">
          Less
        </div>

      </div>


      <!-- REMAINING TOTAL KILO -->

      <div
        class="summary-row"
        id="remainingRow">

        <div class="summary-label">
          Total Kilo
        </div>

      </div>


      <!-- PRICE -->

      <div
        class="summary-row"
        id="priceRow">

        <div class="summary-label">
          Price
        </div>

      </div>


      <!-- TOTAL -->

      <div
        class="summary-row dark-green-row"
        id="amountRow">

        <div class="summary-label">
          Total
        </div>

      </div>


    </div>

  </div>


  <!-- GRAND TOTAL -->

  <div class="grand-total">

    Σ of Total:
    ₱<span id="grandTotal">0.00</span>

  </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const INITIAL_BUYERS = 6;

const ROWS = 10;


/* =====================================================
   SHEETS
===================================================== */

let sheets = [];

let currentSheet = 0;


/* =====================================================
   CREATE BUYER
===================================================== */

function createBuyer(number) {

  return {

    name: "Buyer " + number,

    kilos: Array(ROWS).fill(""),

    less: 10,

    price: ""

  };

}


/* =====================================================
   CREATE SHEET
===================================================== */

function createSheet(name) {

  let buyers = [];

  for (let i = 1; i <= INITIAL_BUYERS; i++) {

    buyers.push(
      createBuyer(i)
    );

  }

  return {

    name: name,

    buyers: buyers

  };

}


/* =====================================================
   FIRST SHEET
===================================================== */

sheets.push(
  createSheet("Carrot 1")
);


/* =====================================================
   ADD SHEET
===================================================== */

function addSheet() {

  let newNumber = sheets.length + 1;

  sheets.push(
    createSheet("Carrot " + newNumber)
  );

  currentSheet = sheets.length - 1;

  render();

}


/* =====================================================
   REMOVE SHEET
===================================================== */

function removeSheet() {

  if (sheets.length === 1) {

    alert("You need at least one sheet.");

    return;

  }

  sheets.splice(currentSheet, 1);

  if (currentSheet >= sheets.length) {

    currentSheet =
      sheets.length - 1;

  }

  render();

}


/* =====================================================
   ADD BUYER
===================================================== */

function addBuyer() {

  let sheet =
    sheets[currentSheet];

  let number =
    sheet.buyers.length + 1;

  sheet.buyers.push(
    createBuyer(number)
  );

  render();

}


/* =====================================================
   REMOVE BUYER
===================================================== */

function removeBuyer() {

  let sheet =
    sheets[currentSheet];

  if (sheet.buyers.length <= 1) {

    alert("You need at least one buyer.");

    return;

  }

  sheet.buyers.pop();

  render();

}


/* =====================================================
   RENDER EVERYTHING
===================================================== */

function render() {

  renderSheets();

  renderTable();

  renderSummary();

  calculate();

}


/* =====================================================
   RENDER SHEET TABS
===================================================== */

function renderSheets() {

  const tabs =
    document.getElementById("sheetTabs");

  tabs.innerHTML = "";

  sheets.forEach(
    function(sheet, index) {

      const button =
        document.createElement("button");

      button.className =
        "sheet-tab" +
        (index === currentSheet
          ? " active"
          : "");

      button.textContent =
        sheet.name;

      button.onclick =
        function() {

          currentSheet = index;

          render();

        };

      tabs.appendChild(button);

    }
  );

}


/* =====================================================
   RENDER MAIN TABLE
===================================================== */

function renderTable() {

  const header =
    document.getElementById("buyerHeaders");

  const rows =
    document.getElementById("buyerRows");

  header.innerHTML =
    '<th class="number-header">#</th>';

  rows.innerHTML = "";

  const sheet =
    sheets[currentSheet];


  /* BUYER HEADERS */

  sheet.buyers.forEach(
    function(buyer, buyerIndex) {

      const th =
        document.createElement("th");

      th.className =
        "buyer-header";


      const input =
        document.createElement("input");

      input.className =
        "buyer-name";

      input.type = "text";

      input.value =
        buyer.name;

      input.placeholder =
        "Buyer name";


      input.oninput =
        function() {

          buyer.name =
            this.value;

        };


      th.appendChild(input);

      header.appendChild(th);

    }
  );


  /* KILO ROWS */

  for (
    let row = 0;
    row < ROWS;
    row++
  ) {

    const tr =
      document.createElement("tr");


    /* ROW NUMBER */

    const numberCell =
      document.createElement("td");

    numberCell.className =
      "number-cell";

    numberCell.textContent =
      row + 1;

    tr.appendChild(numberCell);


    /* BUYER CELLS */

    sheet.buyers.forEach(
      function(buyer, buyerIndex) {

        const td =
          document.createElement("td");


        const input =
          document.createElement("input");

        input.className =
          "kilo-input";

        input.type =
          "number";

        input.inputMode =
          "decimal";

        input.step =
          "0.01";

        input.placeholder =
          "KG";

        input.value =
          buyer.kilos[row];


        input.oninput =
          function() {

            buyer.kilos[row] =
              this.value;

            calculate();

          };


        td.appendChild(input);

        tr.appendChild(td);

      }
    );


    rows.appendChild(tr);

  }

}


/* =====================================================
   RENDER SUMMARY
===================================================== */

function renderSummary() {

  const sheet =
    sheets[currentSheet];


  const totalRow =
    document.getElementById(
      "totalKiloRow"
    );

  const lessRow =
    document.getElementById(
      "lessRow"
    );

  const remainingRow =
    document.getElementById(
      "remainingRow"
    );

  const priceRow =
    document.getElementById(
      "priceRow"
    );

  const amountRow =
    document.getElementById(
      "amountRow"
    );


  totalRow.innerHTML =
    '<div class="summary-label">Total Kilo</div>';

  lessRow.innerHTML =
    '<div class="summary-label">Less</div>';

  remainingRow.innerHTML =
    '<div class="summary-label">Total Kilo</div>';

  priceRow.innerHTML =
    '<div class="summary-label">Price</div>';

  amountRow.innerHTML =
    '<div class="summary-label">Total</div>';


  sheet.buyers.forEach(
    function(buyer) {


      /* TOTAL KILO */

      const totalCell =
        document.createElement("div");

      totalCell.className =
        "summary-cell";

      totalCell.textContent =
        getTotalKilo(buyer)
          .toFixed(2);

      totalRow.appendChild(
        totalCell
      );


      /* LESS */

      const lessCell =
        document.createElement("div");

      lessCell.className =
        "summary-cell";


      const lessInput =
        document.createElement("input");

      lessInput.className =
        "summary-input";

      lessInput.type =
        "number";

      lessInput.inputMode =
        "decimal";

      lessInput.step =
        "0.01";

      lessInput.value =
        buyer.less;


      lessInput.oninput =
        function() {

          buyer.less =
            parseFloat(this.value) || 0;

          calculate();

        };


      lessCell.appendChild(
        lessInput
      );

      lessRow.appendChild(
        lessCell
      );


      /* REMAINING KILO */

      const remainingCell =
        document.createElement("div");

      remainingCell.className =
        "summary-cell";

      remainingCell.textContent =
        (
          getTotalKilo(buyer)
          - buyer.less
        ).toFixed(2);

      remainingRow.appendChild(
        remainingCell
      );


      /* PRICE */

      const priceCell =
        document.createElement("div");

      priceCell.className =
        "summary-cell";


      const priceInput =
        document.createElement("input");

      priceInput.className =
        "summary-input price-input";

      priceInput.type =
        "number";

      priceInput.inputMode =
        "decimal";

      priceInput.step =
        "0.01";

      priceInput.placeholder =
        "₱ Price";

      priceInput.value =
        buyer.price;


      priceInput.oninput =
        function() {

          buyer.price =
            this.value;

          calculate();

        };


      priceCell.appendChild(
        priceInput
      );

      priceRow.appendChild(
        priceCell
      );


      /* TOTAL AMOUNT */

      const amountCell =
        document.createElement("div");

      amountCell.className =
        "summary-cell";

      amountCell.textContent =
        "0.00";

      amountRow.appendChild(
        amountCell
      );

    }
  );

}


/* =====================================================
   CALCULATE TOTAL KILO
===================================================== */

function getTotalKilo(buyer) {

  let total = 0;

  buyer.kilos.forEach(
    function(value) {

      total +=
        parseFloat(value) || 0;

    }
  );

  return total;

}


/* =====================================================
   CALCULATE EVERYTHING
===================================================== */

function calculate() {

  const sheet =
    sheets[currentSheet];


  let grandTotal = 0;


  const amountRow =
    document.getElementById(
      "amountRow"
    );


  const amountCells =
    amountRow.querySelectorAll(
      ".summary-cell"
    );


  sheet.buyers.forEach(
    function(buyer, index) {

      const total =
        getTotalKilo(buyer);


      const remaining =
        total - buyer.less;


      const price =
        parseFloat(buyer.price) || 0;


      const amount =
        remaining * price;


      grandTotal += amount;


      if (amountCells[index]) {

        amountCells[index]
          .textContent =
          amount.toFixed(2);

      }

    }
  );


  document.getElementById(
    "grandTotal"
  ).textContent =
    grandTotal.toFixed(2);

}


/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
