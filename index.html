<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#7fbd68">

<title>Carrot Calculator</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: -apple-system,
               BlinkMacSystemFont,
               "Segoe UI",
               Arial,
               sans-serif;

  background: #f5f7f3;
  color: #222;
}

.app {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 6px;
}

/* =========================
   TITLE
========================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}

h1 {
  margin: 0;
  font-size: 21px;
  color: #5c9d4d;
}

.status {
  font-size: 11px;
  color: #666;
}

/* =========================
   SHEETS
========================= */

.sheetBar {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 5px;

  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.sheetBar::-webkit-scrollbar {
  display: none;
}

.sheetTab {
  flex: 0 0 auto;

  border: 0;
  border-radius: 8px 8px 0 0;

  background: #dfe8df;
  color: #222;

  padding: 8px 12px;

  font-size: 12px;
  font-weight: 700;
}

.sheetTab.active {
  background: #91c77b;
}

.newSheet {
  flex: 0 0 auto;

  border: 0;
  border-radius: 8px;

  background: #222;
  color: white;

  padding: 8px 11px;

  font-size: 12px;
  font-weight: 700;
}

/* =========================
   SHEET BUTTONS
========================= */

.sheetActions {
  display: flex;
  gap: 4px;
  margin-bottom: 5px;
}

.sheetActions button {
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 700;
}

.removeSheet {
  background: #e7dede;
}

/* =========================
   BUYER BUTTONS
========================= */

.buyerActions {
  display: flex;
  gap: 4px;
  margin-bottom: 5px;
}

.buyerActions button {
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 700;
}

.addBuyer {
  background: #7fbd68;
  color: white;
}

.removeBuyer {
  background: #eadede;
}

/* =========================
   CARD
========================= */

.card {
  background: white;
  border-radius: 0 12px 12px 12px;
  box-shadow: 0 2px 8px #0001;
  overflow: hidden;
}

/* =========================
   TABLE SCROLL
========================= */

.tableScroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;
}

/* =========================
   MAIN TABLE
========================= */

.mainTable {
  border-collapse: collapse;

  table-layout: fixed;

  width: max-content;

  min-width: 100%;
}

/*
  Column widths are stored here.
  Drag the divider to change them.
*/

.mainTable col.numberCol {
  width: 42px;
}

.mainTable col.buyerCol {
  width: 120px;
}

.mainTable th,
.mainTable td {
  border: 1px solid #cfd6d0;
}

/* =========================
   HEADER
========================= */

.mainTable th {
  position: relative;

  background: #91c77b;

  height: 44px;

  padding: 2px;

  text-align: center;

  font-size: 11px;
  font-weight: 700;

  white-space: normal;

  overflow: visible;
}

.numberHeader {
  width: 42px;
  min-width: 42px;
}

/* =========================
   BUYER NAME
========================= */

.buyerHeader {
  min-width: 80px;
}

.buyerName {
  width: 100%;
  height: 38px;

  border: 0;
  outline: 0;

  background: transparent;

  text-align: center;

  font-size: 14px;
  font-weight: 700;

  padding: 3px;
}

.buyerName:focus {
  background: #edf8e9;
}

/* =========================
   DRAG DIVIDER
========================= */

.resizeHandle {
  position: absolute;

  top: 0;
  right: -5px;

  width: 10px;
  height: 100%;

  cursor: col-resize;

  z-index: 10;

  touch-action: none;
}

/*
  Make the divider easy to grab
  without changing its appearance.
*/

.resizeHandle::after {
  content: "";

  position: absolute;

  top: 8px;
  bottom: 8px;

  left: 4px;

  width: 2px;

  background: #ffffffaa;

  border-radius: 2px;
}

/* =========================
   NUMBER CELLS
========================= */

.numberCell {
  background: #fafafa;

  width: 42px;
  min-width: 42px;

  text-align: center;

  font-size: 13px;
  font-weight: 600;
}

/* =========================
   KILO INPUT
========================= */

.kiloInput {
  display: block;

  width: 100%;
  height: 41px;

  border: 0;
  outline: 0;

  background: transparent;

  text-align: center;

  font-size: 15px;

  padding: 3px;
}

.kiloInput:focus {
  background: #eef8ea;
}

/* =========================
   SUMMARY
========================= */

.summaryScroll {
  width: 100%;
  overflow-x: auto;

  -webkit-overflow-scrolling: touch;
}

.summary {
  width: max-content;
  min-width: 100%;
}

/* =========================
   SUMMARY ROW
========================= */

.summaryRow {
  display: flex;
  min-width: max-content;
}

.summaryLabel {
  width: 110px;
  min-width: 110px;

  border: 1px solid #cfd6d0;

  padding: 8px 5px;

  background: #f5f7f3;

  text-align: center;

  font-size: 12px;
  font-weight: 700;
}

.summaryCell {
  width: 120px;
  min-width: 120px;

  border: 1px solid #cfd6d0;

  padding: 6px;

  text-align: center;

  font-size: 13px;
}

.totalRow .summaryLabel,
.totalRow .summaryCell {
  background: #dcefd5;
}

.finalRow .summaryLabel,
.finalRow .summaryCell {
  background: #91c77b;
  font-weight: 700;
}

/* =========================
   SUMMARY INPUT
========================= */

.summaryInput {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  text-align: center;

  font-size: 14px;

  padding: 5px;
}

.summaryInput:focus {
  background: #edf8e9;
}

.priceInput {
  border: 1px solid #d8ddd8;
  border-radius: 5px;
}

/* =========================
   GRAND TOTAL
========================= */

.grandTotal {
  margin: 7px;

  padding: 10px;

  border-radius: 8px;

  background: #7fbd68;
  color: white;

  text-align: center;

  font-size: 17px;
  font-weight: 700;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .app {
    padding: 4px;
  }

  h1 {
    font-size: 19px;
  }

  .mainTable th {
    font-size: 9px;
  }

  .buyerName {
    font-size: 13px;
  }

  .kiloInput {
    font-size: 14px;
  }

  .summaryLabel {
    width: 100px;
    min-width: 100px;
  }

  .summaryCell {
    width: 120px;
    min-width: 120px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- TITLE -->

  <div class="top">

    <h1>🥕 Carrot Calculator</h1>

    <span
      class="status"
      id="status">
      Saved
    </span>

  </div>


  <!-- SHEET TABS -->

  <div
    class="sheetBar"
    id="sheetBar">
  </div>


  <!-- SHEET ACTIONS -->

  <div class="sheetActions">

    <button
      class="removeSheet"
      id="removeSheet">
      − Remove Sheet
    </button>

  </div>


  <!-- BUYER ACTIONS -->

  <div class="buyerActions">

    <button
      class="addBuyer"
      id="addBuyer">
      ＋ Add Buyer
    </button>

    <button
      class="removeBuyer"
      id="removeBuyer">
      − Remove Buyer
    </button>

  </div>


  <!-- CARD -->

  <div class="card">


    <!-- MAIN TABLE -->

    <div class="tableScroll">

      <table
        class="mainTable"
        id="mainTable">

        <colgroup id="columnGroup">

          <col class="numberCol">

        </colgroup>


        <thead>

          <tr id="headerRow">

            <th class="numberHeader">
              #
            </th>

          </tr>

        </thead>


        <tbody id="rows">

        </tbody>

      </table>

    </div>


    <!-- SUMMARY -->

    <div class="summaryScroll">

      <div
        class="summary"
        id="summary">

        <!-- Total Kilo -->

        <div
          class="summaryRow totalRow"
          id="totalKiloRow">

          <div class="summaryLabel">
            Total Kilo
          </div>

        </div>


        <!-- Less -->

        <div
          class="summaryRow"
          id="lessRow">

          <div class="summaryLabel">
            Less
          </div>

        </div>


        <!-- Remaining -->

        <div
          class="summaryRow"
          id="remainingRow">

          <div class="summaryLabel">
            Total Kilo
          </div>

        </div>


        <!-- Price -->

        <div
          class="summaryRow"
          id="priceRow">

          <div class="summaryLabel">
            Price
          </div>

        </div>


        <!-- Amount -->

        <div
          class="summaryRow finalRow"
          id="amountRow">

          <div class="summaryLabel">
            Total
          </div>

        </div>

      </div>

    </div>


    <!-- GRAND TOTAL -->

    <div class="grandTotal">

      Σ of Total:
      ₱<span id="grandTotal">
        0.00
      </span>

    </div>


  </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const INITIAL_BUYERS = 6;

const ROW_COUNT = 10;

const STORAGE_KEY =
  "CARROT_CALCULATOR_DATA_V1";


/* =====================================================
   DATA
===================================================== */

let sheets = [];

let currentSheet = 0;


/* =====================================================
   CREATE BUYER
===================================================== */

function createBuyer(number) {

  return {

    name: "Buyer " + number,

    kilos: Array(ROW_COUNT).fill(""),

    less: 10,

    price: ""

  };

}


/* =====================================================
   CREATE SHEET
===================================================== */

function createSheet(name) {

  const buyers = [];

  for (
    let i = 1;
    i <= INITIAL_BUYERS;
    i++
  ) {

    buyers.push(
      createBuyer(i)
    );

  }

  return {

    name: name,

    buyers: buyers

  };

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      sheets: sheets,
      currentSheet: currentSheet
    })
  );

  document.getElementById(
    "status"
  ).textContent = "Saved";

}


/* =====================================================
   LOAD DATA
===================================================== */

function loadData() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

    if (
      saved &&
      saved.sheets &&
      saved.sheets.length
    ) {

      sheets =
        saved.sheets;

      currentSheet =
        saved.currentSheet || 0;

      return;

    }

  } catch (error) {

  }


  sheets = [
    createSheet("Client 1")
  ];

  currentSheet = 0;

}


/* =====================================================
   RENDER SHEET TABS
===================================================== */

function renderSheets() {

  const bar =
    document.getElementById(
      "sheetBar"
    );

  bar.innerHTML = "";

  sheets.forEach(
    function(sheet, index) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "sheetTab";

      if (
        index === currentSheet
      ) {

        button.classList.add(
          "active"
        );

      }

      button.textContent =
        sheet.name;

      button.onclick =
        function() {

          currentSheet = index;

          render();

          saveData();

        };

      bar.appendChild(button);

    }
  );


  /* ADD SHEET BUTTON */

  const newButton =
    document.createElement(
      "button"
    );

  newButton.className =
    "newSheet";

  newButton.textContent =
    "＋ New Sheet";

  newButton.onclick =
    addSheet;

  bar.appendChild(
    newButton
  );

}


/* =====================================================
   ADD SHEET
===================================================== */

function addSheet() {

  let name =
    prompt(
      "Enter client name:"
    );

  if (
    name === null
  ) {

    return;

  }

  name =
    name.trim();


  if (!name) {

    alert(
      "Please enter a client name."
    );

    return;

  }


  const exists =
    sheets.some(
      sheet =>
        sheet.name.toLowerCase() ===
        name.toLowerCase()
    );


  if (exists) {

    alert(
      "That client already exists."
    );

    return;

  }


  sheets.push(
    createSheet(name)
  );

  currentSheet =
    sheets.length - 1;

  render();

  saveData();

}


/* =====================================================
   REMOVE SHEET
===================================================== */

function removeSheet() {

  if (
    sheets.length <= 1
  ) {

    alert(
      "At least one sheet must remain."
    );

    return;

  }


  const name =
    sheets[currentSheet].name;


  if (
    !confirm(
      'Remove "' +
      name +
      '"?'
    )
  ) {

    return;

  }


  sheets.splice(
    currentSheet,
    1
  );


  if (
    currentSheet >=
    sheets.length
  ) {

    currentSheet =
      sheets.length - 1;

  }


  render();

  saveData();

}


/* =====================================================
   ADD BUYER
===================================================== */

function addBuyer() {

  const sheet =
    sheets[currentSheet];

  const number =
    sheet.buyers.length + 1;

  sheet.buyers.push(
    createBuyer(number)
  );

  render();

  saveData();

}


/* =====================================================
   REMOVE BUYER
===================================================== */

function removeBuyer() {

  const sheet =
    sheets[currentSheet];


  if (
    sheet.buyers.length <= 1
  ) {

    alert(
      "At least one buyer must remain."
    );

    return;

  }


  sheet.buyers.pop();

  render();

  saveData();

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable() {

  const sheet =
    sheets[currentSheet];

  const header =
    document.getElementById(
      "headerRow"
    );

  const rows =
    document.getElementById(
      "rows"
    );

  const colGroup =
    document.getElementById(
      "columnGroup"
    );


  /* CLEAR */

  header.innerHTML =
    '<th class="numberHeader">#</th>';

  rows.innerHTML = "";

  colGroup.innerHTML =
    '<col class="numberCol">';


  /* BUYER COLUMNS */

  sheet.buyers.forEach(
    function(buyer, buyerIndex) {

      const col =
        document.createElement(
          "col"
        );

      col.className =
        "buyerCol";

      /*
        Each buyer gets a stored width.
        If none exists, use 120px.
      */

      if (
        buyer.width
      ) {

        col.style.width =
          buyer.width + "px";

      } else {

        col.style.width =
          "120px";

      }

      colGroup.appendChild(col);


      /* HEADER */

      const th =
        document.createElement(
          "th"
        );

      th.className =
        "buyerHeader";


      const input =
        document.createElement(
          "input"
        );

      input.className =
        "buyerName";

      input.value =
        buyer.name;

      input.placeholder =
        "Buyer name";


      input.oninput =
        function() {

          buyer.name =
            this.value;

          saveData();

        };


      th.appendChild(input);


      /* DRAG HANDLE */

      const handle =
        document.createElement(
          "div"
        );

      handle.className =
        "resizeHandle";


      handle.addEventListener(
        "pointerdown",
        function(event) {

          startResize(
            event,
            buyerIndex
          );

        }
      );


      th.appendChild(handle);

      header.appendChild(th);

    }
  );


  /* KILO ROWS */

  for (
    let rowIndex = 0;
    rowIndex < ROW_COUNT;
    rowIndex++
  ) {

    const tr =
      document.createElement(
        "tr"
      );


    /* NUMBER */

    const numberCell =
      document.createElement(
        "td"
      );

    numberCell.className =
      "numberCell";

    numberCell.textContent =
      rowIndex + 1;

    tr.appendChild(
      numberCell
    );


    /* BUYERS */

    sheet.buyers.forEach(
      function(buyer) {

        const td =
          document.createElement(
            "td"
          );


        const input =
          document.createElement(
            "input"
          );

        input.className =
          "kiloInput";

        input.type =
          "number";

        input.inputMode =
          "decimal";

        input.step =
          "0.01";

        input.placeholder =
          "KG";

        input.value =
          buyer.kilos[rowIndex];


        input.addEventListener(
          "input",
          function() {

            buyer.kilos[rowIndex] =
              this.value;

            calculate();

            saveData();

          }
        );


        td.appendChild(input);

        tr.appendChild(td);

      }
    );


    rows.appendChild(tr);

  }

}


/* =====================================================
   MANUAL COLUMN RESIZE
===================================================== */

let resizeData = null;


function startResize(
  event,
  buyerIndex
) {

  event.preventDefault();

  const sheet =
    sheets[currentSheet];

  const table =
    document.getElementById(
      "mainTable"
    );

  const headerCells =
    document.querySelectorAll(
      "#headerRow th"
    );

  const header =
    headerCells[
      buyerIndex + 1
    ];


  const startX =
    event.clientX;

  const startWidth =
    header.getBoundingClientRect()
      .width;


  resizeData = {

    buyerIndex:
      buyerIndex,

    startX:
      startX,

    startWidth:
      startWidth

  };


  document.body.style.cursor =
    "col-resize";

  document.body.style.userSelect =
    "none";


  document.addEventListener(
    "pointermove",
    resizeColumn
  );

  document.addEventListener(
    "pointerup",
    stopResize,
    { once: true }
  );

}


function resizeColumn(event) {

  if (!resizeData) {

    return;

  }


  const difference =
    event.clientX -
    resizeData.startX;


  let newWidth =
    resizeData.startWidth +
    difference;


  /* Minimum width */

  if (
    newWidth < 70
  ) {

    newWidth = 70;

  }


  /* Maximum width */

  if (
    newWidth > 500
  ) {

    newWidth = 500;

  }


  const sheet =
    sheets[currentSheet];

  const buyer =
    sheet.buyers[
      resizeData.buyerIndex
    ];


  buyer.width =
    Math.round(newWidth);


  const cols =
    document.querySelectorAll(
      "#columnGroup .buyerCol"
    );


  if (
    cols[resizeData.buyerIndex]
  ) {

    cols[
      resizeData.buyerIndex
    ].style.width =
      newWidth + "px";

  }

}


function stopResize() {

  saveData();

  resizeData = null;

  document.body.style.cursor =
    "";

  document.body.style.userSelect =
    "";

  document.removeEventListener(
    "pointermove",
    resizeColumn
  );

}


/* =====================================================
   GET TOTAL KILO
===================================================== */

function getTotalKilo(
  buyer
) {

  let total = 0;

  buyer.kilos.forEach(
    function(value) {

      total +=
        parseFloat(value) || 0;

    }
  );

  return total;

}


/* =====================================================
   RENDER SUMMARY
===================================================== */

function renderSummary() {

  const sheet =
    sheets[currentSheet];


  const totalRow =
    document.getElementById(
      "totalKiloRow"
    );

  const lessRow =
    document.getElementById(
      "lessRow"
    );

  const remainingRow =
    document.getElementById(
      "remainingRow"
    );

  const priceRow =
    document.getElementById(
      "priceRow"
    );

  const amountRow =
    document.getElementById(
      "amountRow"
    );


  totalRow.innerHTML =
    '<div class="summaryLabel">Total Kilo</div>';

  lessRow.innerHTML =
    '<div class="summaryLabel">Less</div>';

  remainingRow.innerHTML =
    '<div class="summaryLabel">Total Kilo</div>';

  priceRow.innerHTML =
    '<div class="summaryLabel">Price</div>';

  amountRow.innerHTML =
    '<div class="summaryLabel">Total</div>';


  sheet.buyers.forEach(
    function(buyer) {


      /* TOTAL KILO */

      const totalCell =
        document.createElement(
          "div"
        );

      totalCell.className =
        "summaryCell";

      totalCell.textContent =
        getTotalKilo(buyer)
          .toFixed(2);

      totalRow.appendChild(
        totalCell
      );


      /* LESS */

      const lessCell =
        document.createElement(
          "div"
        );

      lessCell.className =
        "summaryCell";


      const lessInput =
        document.createElement(
          "input"
        );

      lessInput.className =
        "summaryInput";

      lessInput.type =
        "number";

      lessInput.inputMode =
        "decimal";

      lessInput.step =
        "0.01";

      lessInput.value =
        buyer.less;


      lessInput.oninput =
        function() {

          buyer.less =
            parseFloat(this.value) || 0;

          calculate();

          saveData();

        };


      lessCell.appendChild(
        lessInput
      );

      lessRow.appendChild(
        lessCell
      );


      /* REMAINING */

      const remainingCell =
        document.createElement(
          "div"
        );

      remainingCell.className =
        "summaryCell";

      remainingCell.textContent =
        (
          getTotalKilo(buyer) -
          buyer.less
        ).toFixed(2);

      remainingRow.appendChild(
        remainingCell
      );


      /* PRICE */

      const priceCell =
        document.createElement(
          "div"
        );

      priceCell.className =
        "summaryCell";


      const priceInput =
        document.createElement(
          "input"
        );

      priceInput.className =
        "summaryInput priceInput";

      priceInput.type =
        "number";

      priceInput.inputMode =
        "decimal";

      priceInput.step =
        "0.01";

      priceInput.placeholder =
        "₱ Price";

      priceInput.value =
        buyer.price;


      priceInput.oninput =
        function() {

          buyer.price =
            this.value;

          calculate();

          saveData();

        };


      priceCell.appendChild(
        priceInput
      );

      priceRow.appendChild(
        priceCell
      );


      /* TOTAL */

      const amountCell =
        document.createElement(
          "div"
        );

      amountCell.className =
        "summaryCell";

      amountCell.textContent =
        "0.00";

      amountRow.appendChild(
        amountCell
      );

    }
  );

}


/* =====================================================
   CALCULATE
===================================================== */

function calculate() {

  const sheet =
    sheets[currentSheet];


  const amountCells =
    document.querySelectorAll(
      "#amountRow .summaryCell"
    );


  let grandTotal = 0;


  sheet.buyers.forEach(
    function(buyer, index) {

      const total =
        getTotalKilo(buyer);


      const remaining =
        total -
        (parseFloat(buyer.less) || 0);


      const price =
        parseFloat(buyer.price) || 0;


      const amount =
        remaining *
        price;


      grandTotal +=
        amount;


      if (
        amountCells[index]
      ) {

        amountCells[index]
          .textContent =
          amount.toFixed(2);

      }

    }
  );


  document.getElementById(
    "grandTotal"
  ).textContent =
    grandTotal.toFixed(2);

}


/* =====================================================
   RENDER
===================================================== */

function render() {

  renderSheets();

  renderTable();

  renderSummary();

  calculate();

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
  "removeSheet"
).onclick =
  removeSheet;


document.getElementById(
  "addBuyer"
).onclick =
  addBuyer;


document.getElementById(
  "removeBuyer"
).onclick =
  removeBuyer;


/* =====================================================
   START
===================================================== */

loadData();

render();

</script>

</body>
